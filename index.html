<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyurtma Formasi</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:30px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
}

input,
select,
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>
<body>

<div class="container">

<h2>Buyurtma berish</h2>

<form id="orderForm">

<input
type="text"
id="name"
placeholder="Ismingiz"
required>

<input
type="tel"
id="phone"
placeholder="Telefon raqamingiz"
required>

<select id="service">
<option>Landing Page</option>
<option>Telegram Bot</option>
<option>Murakkab Sayt</option>
</select>

<button type="submit">
Yuborish
</button>

</form>

</div>

<script>

const scriptURL =
"https://script.google.com/macros/s/AKfycbyxJ5MzEttcKaGlVve61mtexlO5zi4R3i_Ez6zGtouLfWBgErU19ROWX0CX3cdafcBN/exec";

document
.getElementById("orderForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
    document.getElementById("name").value;

    const phone =
    document.getElementById("phone").value;

    const service =
    document.getElementById("service").value;

    const btn =
    this.querySelector('button[type="submit"]');

    btn.disabled = true;
    btn.innerText = "Yuborilmoqda...";

    try {

        const url =
        scriptURL +
        "?name=" + encodeURIComponent(name) +
        "&phone=" + encodeURIComponent(phone) +
        "&service=" + encodeURIComponent(service);

        await fetch(url);

        alert("Buyurtma yuborildi!");

        this.reset();

    } catch(err){

        console.error(err);

        alert("Xatolik yuz berdi!");

    }

    btn.disabled = false;
    btn.innerText = "Yuborish";

});

</script>

</body>
</html>
